name: publish

# Manual trigger: Actions tab -> publish -> Run workflow. Publishes the current csproj
# Version to nuget.org via Trusted Publishing (policy daxon-publish, owner OlekSt) - no
# stored secrets; the OIDC login exchanges GitHub's identity for a short-lived key.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Pack
        run: dotnet pack src/OutSmart.DAXon -c Release -o out

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: OlekSt

      - name: Push
        run: dotnet nuget push out\*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
